name: Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release & Versioning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Auto-Merge on Release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --auto --merge --delete-branch || gh pr merge "${{ steps.changesets.outputs.pullRequestNumber }}" --merge --delete-branch || true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Publish GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm run release
          git push --follow-tags
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "Release $TAG" --generate-notes
          else
            echo "Release $TAG already exists. Skipping."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
